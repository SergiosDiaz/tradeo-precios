name: Precios diarios

on:
  schedule:
    - cron: "30 5 * * *"   # todos los días a las 05:30 UTC (07:30 en España en verano, 06:30 en invierno)
  workflow_dispatch: {}      # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger precios de Cardmarket (TCGdex)
        run: python3 scripts/recoger_precios.py
      - name: Guardar
        run: |
          git config user.name "tradeo-bot"
          git config user.email "tradeo-bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "Precios $(date -u +%F)"
          git push

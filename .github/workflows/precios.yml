name: Precios diarios

on:
  schedule:
    - cron: "17 2 * * *"   # todos los días a las 02:17 UTC (de madrugada en España)
    - cron: "17 14 * * *"  # repaso por la tarde: solo las expansiones que por la mañana no se pudieron actualizar
  workflow_dispatch:         # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      solo:
        description: "Solo estas expansiones, separadas por comas (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: precios

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Traer los datos de ayer (rama data)
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data; then
            git archive FETCH_HEAD | tar -x -C data
          fi

      # TCGdex tiene un servidor en Europa y otro en América, y el DNS te manda al más cercano. El de América
      # va atrasado (por ejemplo, no tiene los precios de las expansiones más nuevas), así que el robot usa
      # siempre el europeo, el mismo que usan la app y la web desde España. Su dirección se consulta en cada
      # ejecución; si no se puede, se usa la normal.
      - name: Usar el servidor europeo de TCGdex
        run: |
          ip=$(dig @8.8.8.8 api.tcgdex.net +short +subnet=88.0.0.0/24 | grep -E '^[0-9.]+$' | head -1)
          if [ -n "$ip" ]; then
            echo "$ip api.tcgdex.net" | sudo tee -a /etc/hosts
          else
            echo "::warning::no se pudo consultar el servidor europeo de TCGdex; se usa el normal"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recoger precios de todas las cartas (TCGdex) e índice de búsqueda
        env:
          SOLO: ${{ github.event.inputs.solo }}
        run: python3 scripts/recoger_precios.py data ${{ github.event.schedule == '17 14 * * *' && '--repaso' || '' }}

      - name: Publicar en la rama data (un solo commit, sin versiones antiguas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data
          git init -q -b data
          git config user.name "tradeo-bot"
          git config user.email "tradeo-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Precios $(date -u +%F)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
